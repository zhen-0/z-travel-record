<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Record</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Travel Record</h1>
      <p class="subtitle">记录走过的路，看过的风景</p>
    </div>
  </header>

  <main>
    <section class="section about">
      <div class="container">
        <h2>关于这里</h2>
        <p>这里是我们的旅行记录站。每一次出发都是一次新的探索，每一段路程都值得被记住。</p>
      </div>
    </section>

    <section class="section timeline">
      <div class="container">
        <h2>旅行足迹</h2>
        <div class="timeline-grid">
          <article class="card">
            <div class="card-date">2026 春</div>
            <h3>即将启程</h3>
            <p>新的旅程正在筹备中，敬请期待...</p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Travel Record</p>
    </div>
  </footer>
</body>
</html>
