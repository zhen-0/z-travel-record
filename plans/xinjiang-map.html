<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北疆大环线 · 路线图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #map { width: 100vw; height: 100vh; }
  .nav-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(15,23,42,0.9); backdrop-filter: blur(8px);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
  }
  .nav-bar a { color: #94a3b8; text-decoration: none; font-size: 14px; }
  .nav-bar a:hover { color: #fff; }
  .nav-bar span { color: #e2e8f0; font-size: 14px; font-weight: 500; }
  .leaflet-popup-content-wrapper {
    border-radius: 8px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .leaflet-popup-content { margin: 10px 14px; }
  .popup-title { font-weight: 600; font-size: 14px; color: #0f172a; margin-bottom: 4px; }
  .popup-desc { font-size: 12px; color: #64748b; line-height: 1.5; }
  .custom-marker {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff; border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .legend {
    position: fixed; bottom: 30px; left: 20px; z-index: 1000;
    background: rgba(15,23,42,0.85); backdrop-filter: blur(8px); border-radius: 10px;
    padding: 16px; color: #e2e8f0; max-height: 40vh; overflow-y: auto; width: 240px;
  }
  .legend h3 { font-size: 13px; margin-bottom: 10px; color: #fff; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; cursor: pointer; }
  .legend-item:hover { color: #fff; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  @media (max-width: 640px) {
    .legend { width: 180px; font-size: 11px; left: 10px; bottom: 10px; padding: 12px; max-height: 35vh; }
    .nav-bar { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="nav-bar">
  <a href="../index.html">← 所有计划</a>
  <span>/</span>
  <a href="xinjiang.html">北疆大环线</a>
  <span>/ 路线图</span>
</div>
<div id="map"></div>
<div class="legend" id="legend">
  <h3>📌 每日站点</h3>
</div>
<script>
const MAPBOX_TOKEN = "";
const waypoints = [
  { day: 1, date: "9/25", name: "乌鲁木齐", lat: 43.8256, lng: 87.6168, desc: "抵达乌鲁木齐，取车采购" },
  { day: 2, date: "9/26", name: "富蕴", lat: 46.9958, lng: 89.5256, desc: "天山天池 → 沿G216穿越准噶尔盆地 → 富蕴" },
  { day: 3, date: "9/27", name: "布尔津", lat: 47.7043, lng: 86.8615, desc: "可可托海 → 五彩滩日落 → 布尔津（中秋）" },
  { day: 4, date: "9/28", name: "喀纳斯", lat: 48.6833, lng: 87.0333, desc: "布尔津 → 喀纳斯景区" },
  { day: 5, date: "9/29", name: "禾木", lat: 48.5667, lng: 87.4167, desc: "喀纳斯晨景 → 禾木村" },
  { day: 6, date: "9/30", name: "克拉玛依", lat: 45.5945, lng: 84.8795, desc: "禾木 → 布尔津 → 魔鬼城 → 克拉玛依" },
  { day: 7, date: "10/1", name: "赛里木湖", lat: 44.6000, lng: 81.1667, desc: "克拉玛依 → 赛里木湖环湖（国庆）" },
  { day: 8, date: "10/2", name: "伊宁", lat: 43.9167, lng: 81.3167, desc: "赛里木湖 → 果子沟大桥 → 伊宁" },
  { day: 9, date: "10/3", name: "那拉提", lat: 43.4000, lng: 84.0833, desc: "伊宁 → 那拉提草原" },
  { day: 10, date: "10/4", name: "库车", lat: 41.7172, lng: 82.9600, desc: "那拉提 → 独库公路南段 → 库车大峡谷" },
  { day: 11, date: "10/5", name: "库尔勒", lat: 41.7333, lng: 86.1500, desc: "库车 → 库尔勒（博斯腾湖）" },
  { day: 12, date: "10/6", name: "吐鲁番", lat: 42.9500, lng: 89.1833, desc: "库尔勒 → 吐鲁番（火焰山/葡萄沟）" },
  { day: 13, date: "10/7", name: "乌鲁木齐", lat: 43.8256, lng: 87.6168, desc: "吐鲁番 → 乌鲁木齐返程" },
];

const colors = ["#f97316","#eab308","#22c55e","#06b6d4","#3b82f6","#8b5cf6","#ec4899","#f97316","#eab308","#22c55e","#06b6d4","#3b82f6","#8b5cf6"];

const map = L.map("map", { zoomControl: true }).setView([44.5, 86.0], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: "&copy; OpenStreetMap"
}).addTo(map);

const pts = waypoints.map(w => [w.lat, w.lng]);
const polyline = L.polyline(pts, {
  color: "#f97316", weight: 4, opacity: 0.85, dashArray: "8, 6"
}).addTo(map);

for (let i = 0; i < pts.length - 1; i++) {
  L.polyline([pts[i], pts[i+1]], {
    color: colors[i % colors.length], weight: 3, opacity: 0.5
  }).addTo(map);
}

waypoints.forEach((w, i) => {
  const color = colors[i % colors.length];
  const marker = L.marker([w.lat, w.lng], {
    icon: L.divIcon({
      className: "",
      html: `<div class="custom-marker" style="background:${color}">${w.day}</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14]
    })
  }).addTo(map);

  marker.bindPopup(`
    <div class="popup-title"><strong>Day ${w.day}</strong> · ${w.date} · ${w.name}</div>
    <div class="popup-desc">${w.desc}</div>
  `);

  const legend = document.getElementById("legend");
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-dot" style="background:${color}"></div>Day ${w.day} ${w.date} — ${w.name}`;
  item.addEventListener("click", () => {
    map.setView([w.lat, w.lng], 9, { animate: true });
    marker.openPopup();
  });
  legend.appendChild(item);

  L.circleMarker([w.lat, w.lng], {
    radius: 3, color: color, fillColor: color, fillOpacity: 0.8
  }).addTo(map);
});

map.fitBounds(polyline.getBounds().pad(0.15));
</script>
</body>
</html>
